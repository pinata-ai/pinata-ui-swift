name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Test the package
        run: xcodebuild test -scheme PinataUI -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO
      - name: Build the example app
        run: |
          brew install xcodegen
          xcodegen generate --spec Example/project.yml
          xcodebuild build -project Example/PinataUIExample.xcodeproj -scheme PinataUIExample -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
