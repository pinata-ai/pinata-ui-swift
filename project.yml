name: PinataUIMock
options:
  bundleIdPrefix: com.pinata
  deploymentTarget:
    iOS: "16.0"
targets:
  PinataUIMock:
    type: application
    platform: iOS
    sources: [PinataUIMock]
    info:
      path: PinataUIMock/Info.plist
      properties:
        CFBundleDisplayName: Pinata UI mock
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pinata.uimock
        TARGETED_DEVICE_FAMILY: "1"
